<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="Popular Opinions">
  <title>Popular Opinions</title>
  <!-- Quadrato tagliato in diagonale: rosso in alto a sinistra con la caporale
       aperta, nero in basso a destra con quella chiusa. Le caporali sono
       poligoni pieni con le punte tagliate dritte, cosi' gli spigoli restano
       netti a qualunque dimensione. -->
  <rect width="100" height="100" fill="#E5261F"/>
  <path d="M100 0 L100 100 L0 100 Z" fill="#1B1B1B"/>
  <g fill="#fff">
    <path d="M33.5,16.5 L20.0,30.0 L33.5,43.5 L33.5,35.0 L28.5,30.0 L33.5,25.0 Z"/>
    <path d="M51.5,16.5 L38.0,30.0 L51.5,43.5 L51.5,35.0 L46.5,30.0 L51.5,25.0 Z"/>
    <path d="M48.5,56.5 L62.0,70.0 L48.5,83.5 L48.5,75.0 L53.5,70.0 L48.5,65.0 Z"/>
    <path d="M66.5,56.5 L80.0,70.0 L66.5,83.5 L66.5,75.0 L71.5,70.0 L66.5,65.0 Z"/>
  </g>
</svg>
